name: Gate 6 — Formal Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.3.0'
        required: true
        type: string
        default: 'v0.3.0'
      title:
        description: 'Release title'
        required: true
        type: string
        default: 'Autonomous AI Scout v0.3.0'
      confirm:
        description: 'Explicitly confirm publication'
        required: true
        type: boolean
        default: false
      release_sha:
        description: 'Exact verified commit SHA to publish'
        required: true
        type: string
        default: 'fc82d7a6991be232c1b0aeb0201501da67de0d36'

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate release SHA
        env:
          SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          printf '%s' "${SHA}" | grep -Eq '^[0-9a-f]{40}$'
      
      - name: Checkout exact verified release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha }}

      - name: Require release tag to match project version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, tomllib
          tag = os.environ["TAG"].strip()
          if not re.fullmatch(r"v0\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"invalid release tag format: {tag}")
          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          expected = "v" + str(version)
          if tag != expected:
              raise SystemExit(f"tag {tag} does not match project version {expected}")
          print(f"release_version={version}")

      - name: Require green CI for exact release SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/commits/${SHA}/check-runs"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2026-03-10'             > "${RUNNER_TEMP}/checks.json"
          python - <<'PY'
          import json, os
          data = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "checks.json"), encoding="utf-8"))
          runs = [x for x in data.get("check_runs", []) if x.get("name") == "test"]
          if not runs:
              raise SystemExit("No CI test check run exists for release SHA.")
          latest = max(runs, key=lambda x: x.get("completed_at") or "")
          if latest.get("status") != "completed" or latest.get("conclusion") != "success":
              raise SystemExit(f"Release blocked by CI test gate: {latest.get('status')}/{latest.get('conclusion')}")
          print(f"CI test gate verified: check_run={latest.get('id')}")

      - name: Require successful Gate 3, Gate 4 and Gate 5 evidence on exact release SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          for workflow in gate3-coding-provider-smoke.yml gate4-external-connector-smoke.yml gate5-github-admin-readiness.yml; do
            gh api "repos/${REPO}/actions/workflows/${workflow}/runs?head_sha=${SHA}&status=completed&per_page=20"               -H 'Accept: application/vnd.github+json'               -H 'X-GitHub-Api-Version: 2026-03-10'               > "${RUNNER_TEMP}/${workflow}.json"
          done
          python - <<'PY'
          import json, os
          base = os.environ["RUNNER_TEMP"]
          labels = [
              ("gate3-coding-provider-smoke.yml", "Gate 3"),
              ("gate4-external-connector-smoke.yml", "Gate 4"),
              ("gate5-github-admin-readiness.yml", "Gate 5"),
          ]
          for filename, label in labels:
              data = json.load(open(os.path.join(base, filename + ".json"), encoding="utf-8"))
              good = [r for r in data.get("workflow_runs", [])
                      if r.get("status") == "completed" and r.get("conclusion") == "success"]
              if not good:
                  raise SystemExit(f"{label} has no successful completed run for the exact release SHA.")
              print(f"{label}: verified run {good[0].get('id')}")

      - name: Require Gate 5 protection application evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/actions/workflows/gate5-github-admin-readiness.yml/runs?head_sha=${SHA}&status=completed&per_page=20"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2026-03-10'             > "${RUNNER_TEMP}/gate5.json"
          python - <<'PY'
          import json, os, urllib.request
          data = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "gate5.json"), encoding="utf-8"))
          for run in data.get("workflow_runs", []):
              if run.get("conclusion") != "success" or not run.get("id"):
                  continue
              url = f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs/{run['id']}/jobs?per_page=100"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2026-03-10",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  jobs = json.load(response).get("jobs", [])
              for job in jobs:
                  for step in job.get("steps", []):
                      if step.get("name") == "Apply hardened main-branch protection (apply_protection=true)" and step.get("conclusion") == "success":
                          print(f"Gate 5 application step succeeded in run {run['id']}.")
                          raise SystemExit(0)
          raise SystemExit("No successful Gate 5 run for this SHA shows the explicit protection-application step succeeding.")

      - name: Refuse duplicate tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" -H 'Accept: application/vnd.github+json' > /dev/null 2>&1; then
            echo "Release tag already exists: ${TAG}"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"
          cat > "${notes}" <<'EOF'
Formal release of the verified Autonomous AI Scout readiness baseline.

Safety boundary: publication requires explicit confirmation, the exact release SHA, all exact-SHA gates, live external evidence, and repository administration evidence.
EOF
          gh release create "${TAG}" --target "${SHA}" --title "${TITLE}" --notes-file "${notes}"
