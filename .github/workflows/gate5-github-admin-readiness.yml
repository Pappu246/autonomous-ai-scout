name: Gate 5 — GitHub Administration Readiness

on:
  workflow_dispatch:
    inputs:
      apply_protection:
        description: 'Apply the proposed main-branch protection configuration'
        required: true
        type: boolean
        default: false
  push:
    branches:
      - feat/mission-control-ui

permissions:
  contents: read

jobs:
  admin:
    # Push-triggered execution is limited to an explicit release-gate marker.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, 'AI_RELEASE_GATES:APPLY_GATE5')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Require repository-admin token
        env:
          ADMIN_TOKEN: ${{ secrets.SCOUT_GITHUB_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${ADMIN_TOKEN}" || {
            echo 'SCOUT_GITHUB_ADMIN_TOKEN is required with repository Administration permission.'
            exit 1
          }

      - name: Verify current branch protection
        env:
          GH_TOKEN: ${{ secrets.SCOUT_GITHUB_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/branches/main/protection" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            > "${RUNNER_TEMP}/main-protection.json"
          python - <<'PY'
import json, os
path=os.path.join(os.environ['RUNNER_TEMP'],'main-protection.json')
data=json.load(open(path,encoding='utf-8'))
print(json.dumps({
  'required_status_checks': data.get('required_status_checks') or {},
  'required_approvals': (data.get('required_pull_request_reviews') or {}).get('required_approving_review_count'),
  'enforce_admins': (data.get('enforce_admins') or {}).get('enabled'),
  'allow_force_pushes': data.get('allow_force_pushes'),
  'allow_deletions': data.get('allow_deletions'),
}, sort_keys=True))
PY

      - name: Apply hardened main-branch protection when explicitly authorized
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.apply_protection) || (github.event_name == 'push' && contains(github.event.head_commit.message, 'AI_RELEASE_GATES:APPLY_GATE5')) }}
        env:
          GH_TOKEN: ${{ secrets.SCOUT_GITHUB_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY' > "${RUNNER_TEMP}/protection.json"
import json
print(json.dumps({
  'required_status_checks': {'strict': True, 'contexts': ['test'], 'checks': []},
  'enforce_admins': True,
  'required_pull_request_reviews': {
    'dismiss_stale_reviews': True,
    'require_code_owner_reviews': False,
    'required_approving_review_count': 1,
    'require_last_push_approval': True
  },
  'restrictions': None,
  'required_linear_history': False,
  'allow_force_pushes': False,
  'allow_deletions': False,
  'block_creations': False,
  'required_conversation_resolution': True,
  'lock_branch': False
}, separators=(',', ':')))
PY
          gh api --method PUT "repos/${REPO}/branches/main/protection" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            --input "${RUNNER_TEMP}/protection.json" > /dev/null
          echo 'Main branch protection applied.'

      - name: Verify protection after optional update
        env:
          GH_TOKEN: ${{ secrets.SCOUT_GITHUB_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/branches/main/protection" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' > "${RUNNER_TEMP}/verified.json"
          python - <<'PY'
import json, os
path=os.path.join(os.environ['RUNNER_TEMP'],'verified.json')
data=json.load(open(path,encoding='utf-8'))
contexts=(data.get('required_status_checks') or {}).get('contexts') or []
reviews=(data.get('required_pull_request_reviews') or {}).get('required_approving_review_count',0)
if 'test' not in contexts: raise SystemExit(f'missing required test context: {contexts}')
if reviews < 1: raise SystemExit(f'required approvals too low: {reviews}')
if (data.get('enforce_admins') or {}).get('enabled') is not True: raise SystemExit('admin enforcement is disabled')
if data.get('allow_force_pushes') is not False: raise SystemExit('force pushes are allowed')
if data.get('allow_deletions') is not False: raise SystemExit('branch deletion is allowed')
print('Gate 5 main-branch protection verified.')
PY

      - name: Inspect rulesets
        env:
          GH_TOKEN: ${{ secrets.SCOUT_GITHUB_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/rulesets" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' > "${RUNNER_TEMP}/rulesets.json"
          python - <<'PY'
import json, os
path=os.path.join(os.environ['RUNNER_TEMP'],'rulesets.json')
data=json.load(open(path,encoding='utf-8'))
print('ruleset_count=', len(data))
PY