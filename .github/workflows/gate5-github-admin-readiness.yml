name: Gate 5 — GitHub Administration Readiness

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mission-control-ui
    paths:
      - ".github/release-gates/execute.txt"

permissions:
  contents: read

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - name: Gate 5 trigger sanity
        run: |
          echo "Gate 5 trigger accepted for exact SHA ${{ github.sha }}"
