name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checkout integrity
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test "$(git rev-parse HEAD:tests/test_rest_connector.py)" = "db802a8e6010fe30e2237c22ab8c1858fd792647"
          python - <<'PY'
          from pathlib import Path
          text = Path("tests/test_rest_connector.py").read_text(encoding="utf-8")
          canonical_token = 'assert result["json"]["token"] == "Bearer [REDACTED]"'
          canonical_api_key = 'assert result["json"]["nested"]["api_key"] == "[REDACTED]"'
          obsolete_token = 'assert result["json"]["token"] == "***"'
          assert canonical_token in text
          assert canonical_api_key in text
          assert obsolete_token not in text
          print("working-tree redaction contract verified")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[test]'
      - name: Verify pytest source resolution
        run: |
          set -euo pipefail
          rm -rf .pytest_cache tests/__pycache__ __pycache__
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python - <<'PY'
          import ast
          import hashlib
          import importlib.util
          import sys
          from pathlib import Path
          path = Path("tests/test_rest_connector.py").resolve()
          data = path.read_bytes()
          text = data.decode("utf-8")
          canonical_token = 'assert result["json"]["token"] == "Bearer [REDACTED]"'
          canonical_api_key = 'assert result["json"]["nested"]["api_key"] == "[REDACTED]"'
          obsolete_token = 'assert result["json"]["token"] == "***"'
          print(f"source={path}")
          print(f"sha256={hashlib.sha256(data).hexdigest()}")
          assert canonical_token in text
          assert canonical_api_key in text
          assert obsolete_token not in text
          tree = ast.parse(text, filename=str(path))
          matches = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Assert):
                  rendered = ast.unparse(node.test)
                  if "result" in rendered and "token" in rendered:
                      matches.append(rendered)
          assert matches
          assert all("***" not in item for item in matches), matches
          spec = importlib.util.spec_from_file_location("n6_test_rest_connector", path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          assert Path(module.__file__).resolve() == path
          print(f"token_assert_ast={matches}")
          PY
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest --collect-only -q tests/test_rest_connector.py::test_read_succeeds_and_redacts_text_and_json_secrets
      - name: Test
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q
