name: CI

on:
  push:
  pull_request:

concurrency:
  group: autonomous-ai-scout-ci
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checkout integrity
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          echo "checked_out_head=$(git rev-parse HEAD)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e . --no-deps && pip install -r requirements.lock
      - name: Test
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q
  dispatch_external_gates:
    needs: test
    if: >-
      ${{ github.event_name == 'pull_request'
          && github.event.pull_request.head.ref == 'feat/mission-control-ui'
          && github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch authoritative Gate 4 and Gate 5 on this exact branch head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}/actions/workflows"
          message="$(curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPO}/commits/${SHA}" | python -c 'import json,sys; print(json.load(sys.stdin)["commit"]["message"])')"
          if ! printf '%s\n' "${message}" | grep -q 'AI_RELEASE_GATES:DISPATCH'; then
            echo "No exact release-dispatch marker on ${SHA}; leaving external gates untouched."
            exit 0
          fi
          gate4_response="$(curl -sS -w '\n%{http_code}' -X POST "${api}/gate4-external-connector-smoke.yml/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"${REF}\"}")"
          printf '%s\n' "${gate4_response}"
          gate5_response="$(curl -sS -w '\n%{http_code}' -X POST "${api}/gate5-github-admin-readiness.yml/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"${REF}\",\"inputs\":{\"apply_protection\":\"true\"}}")"
          printf '%s\n' "${gate5_response}"
          gate5_status="$(printf '%s\n' "${gate5_response}" | tail -n 1)"
          if [ "${gate5_status}" != "204" ] && [ "${gate5_status}" != "200" ]; then
            echo "Gate 5 dispatch failed with HTTP ${gate5_status}."
            exit 1
          fi
          echo "Dispatched Gate 4 and Gate 5 for ref=${REF}."
