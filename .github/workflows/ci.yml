name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checkout integrity
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          echo "checked_out_head=$(git rev-parse HEAD)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e . --no-deps && pip install -r requirements.lock
      - name: Test
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q

  gate3-local-ollama:
    name: Gate 3 live free coding provider
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci: gate3 live probe') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install -r requirements.lock
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama and pull free coder
        run: |
          set -euo pipefail
          nohup ollama serve >"${RUNNER_TEMP}/ollama.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:3b
      - name: Exercise real OpenAI-compatible model
        env:
          CODING_PROVIDER_1_NAME: ollama-local
          CODING_PROVIDER_1_ENDPOINT: http://127.0.0.1:11434/v1/chat/completions
          CODING_PROVIDER_1_MODEL: qwen2.5-coder:3b
          CODING_PROVIDER_1_API_KEY_ENV: OLLAMA_API_KEY
          CODING_PROVIDER_1_COST_CLASS: free
          CODING_PROVIDER_1_PRIORITY: "10"
          CODING_PROVIDER_1_MAX_ATTEMPTS: "2"
          CODING_PROVIDER_1_TIMEOUT_SECONDS: "180"
          OLLAMA_API_KEY: ollama
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          autonomous-scout-code \
            --root . \
            --project "Pappu246/autonomous-ai-scout" \
            --severity medium \
            --title "Gate 3 live free coding provider" \
            --detail "Prove a real free coding model can produce a reviewable proposal through the bounded coding pipeline." \
            --recommendation "Return a minimal documentation-only patch candidate. Do not modify runtime behavior." \
            --affected README.md \
            --base-branch main \
            --expected-head-sha "${{ github.sha }}"
      - name: Preserve approval boundary
        run: |
          echo "Gate 3 live provider smoke completed only through READY_FOR_APPROVAL."
          echo "No approval, merge, deploy, billing, or external side effect occurs."
