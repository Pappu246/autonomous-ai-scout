name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checkout integrity
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "expected=$expected"
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$expected"
          echo "TEST_BLOB=$(git rev-parse HEAD:tests/test_rest_connector.py)"
          echo "WORKFLOW_BLOB=$(git rev-parse HEAD:.github/workflows/ci.yml)"
          test "$(git rev-parse HEAD:tests/test_rest_connector.py)" = "db802a8e6010fe30e2237c22ab8c1858fd792647"
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_rest_connector.py")
          text = path.read_text(encoding="utf-8")
          assert 'assert result["json"]["token"] == "Bearer [REDACTED]"' in text
          assert 'assert result["json"]["nested"]["api_key"] == "[REDACTED]"' in text
          assert 'assert result["json"]["token"] == "***"' not in text
          print(f"verified {path} contains canonical N6 redaction contract")
          print(f"test_size={path.stat().st_size}")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[test]'
      - name: Verify pytest source resolution
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path("tests/test_rest_connector.py")
          data = path.read_bytes()
          print(f"cwd={Path.cwd()}")
          print(f"source={path.resolve()}")
          print(f"sha256={hashlib.sha256(data).hexdigest()}")
          print(f"contains_redacted={'assert result[\"json\"][\"token\"] == \"Bearer [REDACTED]\"' in data.decode()}")
          print(f"contains_stars={'assert result[\"json\"][\"token\"] == \"***\"' in data.decode()}")
          import ast
          tree = ast.parse(data.decode())
          target = next(node for node in ast.walk(tree) if isinstance(node, ast.Assert) and 'token' in ast.unparse(node.test))
          print(f"token_assert_ast={ast.unparse(target.test)}")
          PY
          python -m pytest --collect-only -q tests/test_rest_connector.py::test_read_succeeds_and_redacts_text_and_json_secrets
      - name: Test
        run: pytest -q
