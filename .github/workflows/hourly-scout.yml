name: Hourly Autonomous AI Scout

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: autonomous-ai-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Run scout
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m autonomous_agent.main

      - name: Publish state and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/latest_report.md state/scout_state.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update autonomous scout state"
          git push
