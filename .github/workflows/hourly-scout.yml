name: Hourly Autonomous AI Scout

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Natural-language digital task for the agent"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

concurrency:
  group: autonomous-ai-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[test]'
      - name: Verify checkout integrity
        run: |
          set -euo pipefail
          expected="\${{ github.sha }}"
          test "\$(git rev-parse HEAD)" = "\$expected"
      - name: Test
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q
      - name: Run scout
        env:
          GITHUB_REPOSITORY: \${{ github.repository }}
          GITHUB_TOKEN: \${{ github.token }}
          SCOUT_OWNER: Pappu246
          TASK_REQUEST: \${{ github.event.inputs.task || '' }}
          GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}
          SMTP_USERNAME: \${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: \${{ secrets.SMTP_APP_PASSWORD }}
          REPORT_EMAIL: \${{ secrets.REPORT_EMAIL }}
        run: python -m autonomous_agent.main
      - name: Upload generated state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scout-state
          retention-days: 1
          if-no-files-found: error
          path: |
            state/latest_report.md
            state/scout_state.json
            state/project_registry.json
            state/project_profiles.json
            state/project_intelligence.json

  publish:
    needs: scout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout state branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: autonomous-ai-scout-state
          persist-credentials: false
      - name: Download generated state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scout-state
          path: $RUNNER_TEMP/scout-state
      - name: Publish state and report
        env:
          GITHUB_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          for file in \
            state/latest_report.md \
            state/scout_state.json \
            state/project_registry.json \
            state/project_profiles.json \
            state/project_intelligence.json
          do
            cp "$RUNNER_TEMP/scout-state/$(basename "$file")" "$file"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/latest_report.md state/scout_state.json state/project_registry.json state/project_profiles.json state/project_intelligence.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update autonomous scout state"
          git -c "http.extraheader=AUTHORIZATION: bearer \${GITHUB_TOKEN}" push origin HEAD:refs/heads/autonomous-ai-scout-state
