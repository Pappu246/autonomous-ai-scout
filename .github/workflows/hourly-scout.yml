name: Hourly Autonomous AI Scout

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Natural-language digital task for the agent"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: autonomous-ai-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[test]'
      - name: Test
        run: pytest -q
      - name: Run scout
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          SCOUT_OWNER: Pappu246
          TASK_REQUEST: ${{ github.event.inputs.task || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
        run: python -m autonomous_agent.main
      - name: Publish state and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/latest_report.md state/scout_state.json state/project_registry.json state/project_profiles.json state/project_intelligence.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update autonomous scout state"
          git push
