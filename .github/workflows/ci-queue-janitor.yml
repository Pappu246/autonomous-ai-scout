name: CI Queue Janitor

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

jobs:
  janitor:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Cancel stale CI verification runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["REPO"]
          current_sha = os.environ["CURRENT_SHA"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2026-03-10",
          }

          url = f"https://api.github.com/repos/{repo}/actions/runs?per_page=100"
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as response:
              runs = json.load(response).get("workflow_runs", [])

          keep = {"CI", "Gate 3 — Coding Provider Smoke"}
          stale = [
              run for run in runs
              if run.get("name") in keep
              and run.get("head_sha") != current_sha
              and run.get("status") in {"queued", "in_progress"}
          ]

          cancelled = 0
          for run in stale:
              cancel_url = f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/cancel"
              cancel = urllib.request.Request(cancel_url, headers=headers, method="POST")
              try:
                  with urllib.request.urlopen(cancel, timeout=30) as response:
                      if response.status in {202, 204}:
                          cancelled += 1
                          print(f"cancelled {run['id']} {run['name']} {run['head_sha']}")
              except Exception as exc:
                  print(f"could not cancel {run['id']}: {type(exc).__name__}: {exc}")

          print(f"stale_candidates={len(stale)} cancelled={cancelled} current_sha={current_sha}")
          PY
