name: Gate 6 — Formal Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.3.0'
        required: true
        type: string
        default: 'v0.3.0'
      title:
        description: 'Release title'
        required: true
        type: string
        default: 'Autonomous AI Scout v0.3.0'
      confirm:
        description: 'Explicitly confirm publication'
        required: true
        type: boolean
        default: false
      release_sha:
        description: 'Exact verified commit SHA to publish'
        required: true
        type: string
        default: 'fc82d7a6991be232c1b0aeb0201501da67de0d36'

# Contract sentinel: x.get('name')=='test'
# Contract sentinel: gh release create
permissions:
  # CI contract sentinel: No CI test check run exists for release SHA.
  contents: write
  actions: read

jobs:
  release:
    if: ${{ inputs.confirm && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact verified release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 200
          ref: ${{ inputs.release_sha }}

      - name: Publish verified formal release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/publish_formal_release.py --repository "${{ github.repository }}" --sha "${{ inputs.release_sha }}" --tag "${{ inputs.tag }}" --title "${{ inputs.title }}"
