name: Gate 3 — Coding Provider Smoke (Authoritative)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Free ephemeral local model or operator-supplied external provider"
        required: true
        type: choice
        options:
          - local_ollama
          - external
        default: local_ollama
      project:
        description: "Repository identity passed to the bounded coding pipeline"
        required: true
        type: string
        default: "Pappu246/autonomous-ai-scout"
      provider_name:
        description: "External provider name"
        required: false
        type: string
        default: "provider"
      provider_endpoint:
        description: "HTTPS external provider endpoint"
        required: false
        type: string
      provider_model:
        description: "External provider model"
        required: false
        type: string
      cost_class:
        description: "External provider cost class"
        required: true
        type: choice
        options: [free, paid]
        default: free
      allow_paid:
        description: "Explicitly allow the selected paid external route"
        required: true
        type: boolean
        default: false
  push:
    paths:
      - ".github/workflows/gate3-coding-provider-smoke.yml"


permissions:
  contents: read

jobs:
  local_ollama:
    name: Live free provider — Ollama
    if: ${{ github.event_name == 'push' || inputs.mode == 'local_ollama' }}
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - name: Checkout exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install -r requirements.lock

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull free coding model
        run: |
          set -euo pipefail
          nohup ollama serve >"${RUNNER_TEMP}/ollama.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:3b

      - name: Prove OpenAI-compatible local endpoint
        env:
          OLLAMA_API_KEY: ollama
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          body=json.dumps({"model":"qwen2.5-coder:3b","messages":[{"role":"user","content":"Reply with JSON only: {\"ok\":true}"}],"stream":False}).encode()
          req=urllib.request.Request(
              "http://127.0.0.1:11434/v1/chat/completions",
              data=body,
              headers={"Authorization":"Bearer "+os.environ["OLLAMA_API_KEY"],"Content-Type":"application/json"},
              method="POST")
          with urllib.request.urlopen(req, timeout=180) as response:
              data=json.load(response)
          assert data.get("choices"), "no choices"
          assert data["choices"][0]["message"].get("content"), "empty completion"
          print("Ollama OpenAI-compatible endpoint returned a completion.")
          PY

      - name: Run bounded coding-provider smoke
        env:
          CODING_PROVIDER_1_NAME: ollama-local
          CODING_PROVIDER_1_ENDPOINT: http://127.0.0.1:11434/v1/chat/completions
          CODING_PROVIDER_1_MODEL: qwen2.5-coder:3b
          CODING_PROVIDER_1_API_KEY_ENV: OLLAMA_API_KEY
          CODING_PROVIDER_1_COST_CLASS: free
          CODING_PROVIDER_1_PRIORITY: "10"
          CODING_PROVIDER_1_MAX_ATTEMPTS: "3"
          CODING_PROVIDER_1_TIMEOUT_SECONDS: "300"
          OLLAMA_API_KEY: ollama
          CODING_PROVIDER_1_STRUCTURED_OUTPUT: "true"
          CODING_PROVIDER_1_TEMPERATURE: "0"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          autonomous-scout-code             --root .             --project "${{ inputs.project || 'Pappu246/autonomous-ai-scout' }}"             --severity medium             --title "Gate 3 local coding provider smoke"             --detail "Prove a real free coding model can produce a reviewable proposal through the bounded coding pipeline."             --recommendation "Edit only tools/GATE3_SMOKE_TARGET.md. Insert exactly one plain-text line at the end saying: Gate 3 primary smoke marker. Keep every other line unchanged. Return the complete resulting tools/GATE3_SMOKE_TARGET.md in file_contents, a real unified diff with an @@ hunk for that file, a concise summary, and an empty test_commands array. Do not touch any other path and do not return prose outside the JSON object."             --affected tools/GATE3_SMOKE_TARGET.md             --base-branch main             --expected-head-sha "${{ github.sha }}"             --timeout 120             --max-revisions 1


      - name: Confirm bounded diff normalization boundary
        run: |
          set -euo pipefail
          echo "Provider adapter uses bounded-context diff normalization v2 for malformed diff formatting."
          echo "Final patch review and injected validation remain authoritative."

      - name: Preserve approval boundary
        run: |
          echo "Gate 3 authoritative live smoke ends at READY_FOR_APPROVAL."
          echo "never approves, executes, merges, or deploys"
          echo "No approval, billing, or external side effect occurs."


  external:
    name: Operator external provider smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'external' }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install -r requirements.lock
      - name: Gate 3 live execution credential
        env:
          SCOUT_CODING_PROVIDER_API_KEY: ${{ secrets.SCOUT_CODING_PROVIDER_API_KEY }}
        run: |
          echo "Gate 3 live execution."
          test -n "${SCOUT_CODING_PROVIDER_API_KEY}"
      - name: Require HTTPS endpoint
        env:
          ENDPOINT: ${{ inputs.provider_endpoint }}
        run: |
          case "${ENDPOINT}" in https://*) ;; *) echo "HTTPS endpoint required"; exit 1;; esac
      - name: Run bounded external provider smoke
        env:
          CODING_PROVIDER_1_NAME: ${{ inputs.provider_name }}
          CODING_PROVIDER_1_ENDPOINT: ${{ inputs.provider_endpoint }}
          CODING_PROVIDER_1_MODEL: ${{ inputs.provider_model }}
          CODING_PROVIDER_1_API_KEY_ENV: SCOUT_CODING_PROVIDER_API_KEY
          CODING_PROVIDER_1_COST_CLASS: ${{ inputs.cost_class }}
          CODING_PROVIDER_1_PRIORITY: "10"
          CODING_PROVIDER_1_MAX_ATTEMPTS: "2"
          CODING_PROVIDER_1_TIMEOUT_SECONDS: "120"
          SCOUT_CODING_PROVIDER_API_KEY: ${{ secrets.SCOUT_CODING_PROVIDER_API_KEY }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          args=()
          if [ "${{ inputs.allow_paid }}" = "true" ]; then args+=(--allow-paid); fi
          autonomous-scout-code             --root .             --project "${{ inputs.project }}"             --severity medium             --title "Gate 3 external coding provider smoke"             --detail "Prove the configured external coding provider can produce a reviewable patch candidate."             --recommendation "Return a minimal documentation-only patch candidate."             --affected README.md             --base-branch main             --expected-head-sha "${{ github.sha }}"             "${args[@]}"
