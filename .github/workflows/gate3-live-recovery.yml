name: Gate 3 — Live Provider Recovery Smoke (Current Main)

on:
  push:
    paths:
      - ".github/workflows/gate3-live-recovery.yml"

concurrency:
  group: autonomous-ai-scout-gate3-live-recovery
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live_provider:
    name: Real free coding model recovery path
    runs-on: ubuntu-slim
    timeout-minutes: 12
    steps:
      - name: Checkout exact workflow head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install reproducible dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install -r requirements.lock

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull free coding model
        run: |
          set -euo pipefail
          nohup ollama serve >"${RUNNER_TEMP}/ollama.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:3b

      - name: Prove the real OpenAI-compatible endpoint
        env:
          OLLAMA_API_KEY: ollama
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          body=json.dumps({
              "model":"qwen2.5-coder:3b",
              "messages":[{"role":"user","content":"Return JSON only with exactly one key: ok=true."}],
              "stream":False,
              "temperature":0,
          }).encode()
          req=urllib.request.Request(
              "http://127.0.0.1:11434/v1/chat/completions",
              data=body,
              headers={"Authorization":"Bearer "+os.environ["OLLAMA_API_KEY"],"Content-Type":"application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=180) as response:
              data=json.load(response)
          assert data.get("choices"), "no choices"
          assert data["choices"][0]["message"].get("content"), "empty completion"
          print("real local coding endpoint returned a completion")
          PY

      - name: Run bounded coding-provider pipeline
        env:
          CODING_PROVIDER_1_NAME: ollama-recovery
          CODING_PROVIDER_1_ENDPOINT: http://127.0.0.1:11434/v1/chat/completions
          CODING_PROVIDER_1_MODEL: qwen2.5-coder:3b
          CODING_PROVIDER_1_API_KEY_ENV: OLLAMA_API_KEY
          CODING_PROVIDER_1_COST_CLASS: free
          CODING_PROVIDER_1_PRIORITY: "10"
          CODING_PROVIDER_1_MAX_ATTEMPTS: "2"
          CODING_PROVIDER_1_TIMEOUT_SECONDS: "180"
          CODING_PROVIDER_1_STRUCTURED_OUTPUT: "true"
          CODING_PROVIDER_1_TEMPERATURE: "0"
          OLLAMA_API_KEY: ollama
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          autonomous-scout-code             --root .             --project "${{ github.repository }}"             --severity medium             --title "Gate 3 provider recovery smoke"             --detail "Produce one reviewable documentation-only proposal through the real coding-provider stack."             --recommendation "Edit only tools/GATE3_SMOKE_TARGET.md. Insert exactly one plain-text line at the end saying: Gate 3 recovery smoke marker. Keep every other line unchanged. Return the complete resulting tools/GATE3_SMOKE_TARGET.md in file_contents, a real unified diff with an @@ hunk for that file, a concise summary, and an empty test_commands array. Do not touch any other path and do not return prose outside the JSON object."             --affected tools/GATE3_SMOKE_TARGET.md             --base-branch main             --expected-head-sha "${{ github.sha }}"             --timeout 120             --max-revisions 1

      - name: Preserve approval boundary
        run: |
          echo "Live provider recovery ends at READY_FOR_APPROVAL."
          echo "No approval, branch mutation, merge, deploy, billing, or external side effect occurs."
