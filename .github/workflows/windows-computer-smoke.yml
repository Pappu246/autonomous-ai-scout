name: Windows Computer Smoke

on:
  workflow_dispatch:

jobs:
  windows-computer:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Win32 computer integration checks
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q tests/test_computer_windows_integration.py
