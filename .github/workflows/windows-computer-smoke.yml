name: Windows Computer Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "autonomous_agent/computer/**"
      - "tests/test_computer_windows_integration.py"
      - ".github/workflows/windows-computer-smoke.yml"
  pull_request:
    paths:
      - "autonomous_agent/computer/**"
      - "tests/test_computer_windows_integration.py"
      - ".github/workflows/windows-computer-smoke.yml"

jobs:
  windows-computer:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e . --no-deps && python -m pip install -r requirements.lock
      - name: Run Win32 computer integration checks
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q tests/test_computer_windows_integration.py
