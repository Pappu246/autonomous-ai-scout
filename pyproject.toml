[project]
name = "autonomous-ai-scout"
version = "0.2.3"
description = "Free-first autonomous AI scout, project auditor, benchmarker and opportunity agent"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
autonomous-scout = "autonomous_agent.runtime:main"
autonomous-scout-run = "autonomous_agent.main:main"
autonomous-scout-server = "autonomous_agent.server:main"
autonomous-scout-code = "autonomous_agent.coding_cli:main"
autonomous-scout-doctor = "autonomous_agent.doctor:main"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["autonomous_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
