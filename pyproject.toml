[project]
name = "autonomous-ai-scout"
version = "0.2.1"
description = "Free-first autonomous AI scout, project auditor, benchmarker and opportunity agent"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["autonomous_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
